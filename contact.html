<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - ThePreeFiles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header aur Navbar -->
    <header>
        <h1>ThePreeFiles</h1>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="stories.html">Stories</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Contact Form Section -->
    <main class="contact-section">
        <h2>Get in Touch</h2>
        <p>Aapke koi bhi sawal ya sujhaav hon, toh aap yahan message bhej sakte hain!</p>
        
        <form  id="contactform" class="contact-form" action="https://formspree.io/f/mlgqavlr" method="POST">
            <div class="form-group">
                <label for="name">Aapka Naam:</label>
                <input type="text" id="name" name='name' placeholder="Apna naam likhein" required>
            </div>

            <div class="form-group">
                <label for="email">Aapka Email:</label>
                <input type="email" id="email"name='email' placeholder="Apna email likhein" required>
            </div>

            <div class="form-group">
                <label for="message">Aapka Message:</label>
                <textarea id="message" name='message'rows="5" placeholder="Yahan apna message likhein..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Message Bhejein</button>
        </form>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ThePreeFiles. All rights reserved.</p>
        <p>Created with passion by Preetam</p>
    </footer>
<script>
    const form = document.getElementById('contactForm');

    form.addEventListener('submit', async function(e) {
        e.preventDefault(); 
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('https://formspree.io/f/mlgqavlr', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('Aapka message safaltaपूर्वक bhej diya gaya hai!');
                form.reset();
            } else {
                alert('Kuch gadbad ho gayi, kripya dubara koshish karein.');
            }
        } catch (error) {
            alert('Error: Message nahi bhej paya.');
        }
    });
</script>
</body>
</html>
